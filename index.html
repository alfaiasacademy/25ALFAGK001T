<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfa Institute - General Knowledge Quiz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter & Noto Sans Tamil -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans Tamil', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                            900: '#0a3651',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Anti-Copy Protection Styling */
        body, html {
            -webkit-user-select: none; /* Safari */
            -moz-user-select: none;    /* Firefox */
            -ms-user-select: none;     /* IE10+/Edge */
            user-select: none;         /* Standard */
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Option selection pulse animation */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-select {
            animation: pulse-ring 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between"
      oncopy="return false" 
      oncut="return false" 
      onpaste="return false" 
      oncontextmenu="return false" 
      onselectstart="return false">

    <!-- Header / Branding Bar -->
    <header class="bg-gradient-to-r from-brand-900 via-brand-800 to-brand-700 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 sm:px-6 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2 rounded-lg backdrop-blur-sm border border-white/20">
                    <i class="fa-solid fa-graduation-cap text-2xl text-amber-300"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-tight">Alfa Institute</h1>
                    <p class="text-xs sm:text-sm text-brand-100 font-medium">Multiple Choice Questions Self-Evaluation Test</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <!-- Question Grid Modal Toggle Button -->
                <button id="openGridBtn" onclick="toggleGridModal()" class="flex items-center gap-1.5 px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white text-xs sm:text-sm font-medium rounded-lg border border-white/20 transition-all">
                    <i class="fa-solid fa-th"></i>
                    <span>Question Palette</span>
                </button>
                
                <!-- Quick Reset / Restart -->
                <button onclick="resetQuiz()" class="flex items-center gap-1.5 px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs sm:text-sm font-semibold rounded-lg shadow-sm transition-all">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">Reset</span>
                </button>
            </div>
        </div>

        <!-- Subheader Quiz Info Bar -->
        <div class="bg-brand-900/60 border-t border-brand-700/50 py-1.5 px-4 text-xs text-brand-100">
            <div class="max-w-6xl mx-auto flex flex-wrap justify-between items-center gap-2">
                <span class="font-semibold text-amber-300 flex items-center gap-1">
                    <i class="fa-solid fa-book-bookmark text-xs"></i>
                    General Knowledge [Code-25ALFAGK001T QUIZ]
                </span>
                <span id="scoreTracker" class="bg-brand-800/80 px-2.5 py-0.5 rounded-full text-white font-medium border border-brand-600">
                    Attempted: 0 / 100
                </span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-slate-700/50 h-1.5">
            <div id="progressBar" class="bg-amber-400 h-1.5 transition-all duration-300 ease-out" style="width: 1%;"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto w-full px-4 py-6 flex-grow">
        
        <!-- Question Card -->
        <div class="bg-white rounded-2xl shadow-md border border-slate-200/80 overflow-hidden transition-all">
            
            <!-- Question Top Header Status -->
            <div class="bg-slate-50 border-b border-slate-200 px-6 py-3.5 flex justify-between items-center">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-brand-100 text-brand-800 border border-brand-200">
                    <i class="fa-solid fa-circle-question mr-1.5"></i>
                    Question <span id="currentQNum" class="mx-1">1</span> of 100
                </span>
                <span id="statusBadge" class="text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-200 text-slate-600">
                    Unanswered
                </span>
            </div>

            <!-- Question Text Block -->
            <div class="p-6 sm:p-8 border-b border-slate-100">
                <h2 id="questionText" class="text-base sm:text-lg md:text-xl font-semibold text-slate-800 leading-relaxed">
                    <!-- Loaded dynamically -->
                </h2>
            </div>

            <!-- Options Block -->
            <div class="p-6 sm:p-8 bg-slate-50/50 space-y-3.5" id="optionsContainer">
                <!-- Checkbox Option items rendered dynamically -->
            </div>

            <!-- Revealed Correct Answer Box (Hidden initially) -->
            <div id="answerBox" class="mx-6 sm:mx-8 mb-6 p-4 rounded-xl border hidden transition-all duration-300">
                <div class="flex items-start gap-3">
                    <div id="answerIcon" class="mt-0.5 text-lg"></div>
                    <div>
                        <div id="answerTitle" class="font-bold text-sm sm:text-base"></div>
                        <p id="answerDetail" class="text-xs sm:text-sm mt-0.5 text-slate-700 font-medium"></p>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Bottom Sticky Navigation Footer -->
    <footer class="bg-white border-t border-slate-200 shadow-lg py-3 px-4 sticky bottom-0 z-20">
        <div class="max-w-4xl mx-auto flex justify-between items-center gap-4">
            
            <!-- Previous Button (Bottom Left) -->
            <button id="prevBtn" onclick="prevQuestion()" disabled 
                class="flex items-center gap-2 px-5 py-2.5 bg-slate-100 text-slate-700 font-semibold text-sm rounded-xl hover:bg-brand-50 hover:text-brand-700 border border-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all shadow-sm">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Previous</span>
            </button>

            <!-- Question Jump Dropdown for Quick Access -->
            <div class="hidden sm:flex items-center gap-2 text-xs font-medium text-slate-500">
                <label for="jumpSelect">Go to:</label>
                <select id="jumpSelect" onchange="jumpToQuestion(parseInt(this.value))" class="bg-slate-100 border border-slate-300 rounded-lg px-2 py-1 text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <!-- Next Button (Bottom Right) -->
            <button id="nextBtn" onclick="nextQuestion()" 
                class="flex items-center gap-2 px-6 py-2.5 bg-brand-600 text-white font-semibold text-sm rounded-xl hover:bg-brand-700 border border-brand-700 shadow-md transition-all">
                <span id="nextBtnText">Next</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>
    </footer>

    <!-- Question Navigation Modal (Grid Palette) -->
    <div id="gridModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 sm:p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-slate-800">Question Palette</h3>
                    <p class="text-xs text-slate-500">Jump directly to any of the 100 questions</p>
                </div>
                <button onclick="toggleGridModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg hover:bg-slate-200 transition-colors">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Legend Bar -->
            <div class="bg-slate-100/70 px-4 py-2 border-b border-slate-200 flex flex-wrap gap-4 text-xs font-medium text-slate-600">
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-slate-200 border border-slate-300 inline-block"></span>
                    <span>Unattempted</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
                    <span>Correct</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full bg-rose-500 inline-block"></span>
                    <span>Incorrect</span>
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="w-3 h-3 rounded-full border-2 border-brand-600 inline-block"></span>
                    <span>Current</span>
                </div>
            </div>

            <!-- Grid Buttons List -->
            <div class="p-4 sm:p-6 overflow-y-auto flex-grow">
                <div id="modalGridContainer" class="grid grid-cols-5 sm:grid-cols-10 gap-2 text-center text-xs sm:text-sm font-semibold">
                    <!-- Rendered via JS -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 bg-slate-50 border-t border-slate-200 flex justify-end">
                <button onclick="toggleGridModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-sm font-medium rounded-lg transition-colors">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        /* 100 MCQs Dataset */
        const questionsData = [
            { id: 1, q: "பம்பாயில் சேவா சதனை நிறுவியவர் யார்?", options: ["பஹாராம்ஜி மலபாரி", "சிவன் நரேன் அக்னிஹோத்ரி", "ஆர். ஜி. பண்டார்கர்", "பி. கே. ஜெயகர்"], ans: "A" },
            { id: 2, q: "சிந்து மாகாணத்தின் பிரிட்டிஷ் குடியிருப்பாளராக சர் சார்லஸ் நேப்பியர் யாரை மாற்றினார்?", options: ["அலெக்சாண்டர் பர்னியர்", "ஜேம்ஸ் உட்ரம்", "சர் ஜான் கர்னே", "சர் ஐர் கூட்"], ans: "B" },
            { id: 3, q: "கிழக்கிந்திய கம்பெனி எப்போது பாராளுமன்றக் கட்டுப்பாட்டின் கீழ் கொண்டுவரப்பட்டது?", options: ["1773", "1784", "1793", "மேற்கூறியவை எதுவும் இல்லை"], ans: "A" },
            { id: 4, q: "பின்வரும் எந்தச் சட்டம் 'கட்டுப்பாட்டு வாரியத்தை' உருவாக்கியது?", options: ["ஒழுங்குமுறைச் சட்டம், 1773", "பிட்ஸின் இந்தியா சட்டம், 1784", "1813 ஆம் ஆண்டு சட்டம்", "1833 ஆம் ஆண்டு சட்டம்"], ans: "B" },
            { id: 5, q: "1857 ஆம் ஆண்டு இயக்கத்தின் தன்மை பற்றி \"இது முதல் போரோ, தேசிய போரோ, சுதந்திரப் போரோ அல்ல\" என்று பின்வரும் வரலாற்றாசிரியர்களில் யார் எழுதியுள்ளனர்?", options: ["T. R. Holmes", "R. C. Majumdar", "S. B. Chaudhuri", "G. B. Mallison"], ans: "B" },
            { id: 6, q: "பின்வரும் இணைகளில் எது சரியாகப் பொருந்தவில்லை?", options: ["ஜான்சி — லட்சுமி பாய்", "குவாலியர் — தாத்யா டோப்", "கான்பூர் — நானா சாஹேப்", "அலகாபாத் — குன்வர் சிங்"], ans: "D" },
            { id: 7, q: "1857 இயக்கத்தின் அதிகாரப்பூர்வ வரலாற்றாசிரியர்—", options: ["எஸ். என். சென்", "ஆர். சி. மஜும்தார்", "தாராசந்த்", "வி. டி. சாவர்க்கர்"], ans: "A" },
            { id: 8, q: "பின்வரும் சங்கங்களை அவற்றின் தலைவர்களுடன் பொருத்தவும்—\n(a) பிரிட்டிஷ் இந்திய சங்கம், 1851 - 1. ராஜா ராதாகந்த் தேவ்\n(b) டெக்கான் சங்கம், 1852 - 2. கோபால் ஹரி தேஷ்முக்\n(c) பம்பாய் சங்கம், 1852 - 4. ஜாம்ஷெட்ஜி ஜிஜாபாய்\n(d) பிரிட்டிஷ் இந்திய மெட்ராஸ் சங்கம், 1850 - 3. சி. ஒய். முதலியார்\n\nசரியான குறியீட்டைத் தேர்ந்தெடுக்கவும் (a) (b) (c) (d):", options: ["2  1  4  3", "1  2  4  3", "1  2  3  4", "1  2  4  3"], ans: "D" },
            { id: 9, q: "1882 இல் இந்திய கல்வி ஆணையத்திற்குத் தலைமை தாங்கியவர் யார்?", options: ["மெக்காலே", "சாட்லர்", "W. W. ஹண்டர்", "மேற்கூறியவை எதுவும் இல்லை"], ans: "C" },
            { id: 10, q: "பின்வரும் இணைகளில் எது சரியாகப் பொருந்துகிறது?\nI. சாந்தலர்கள் - ஜார்கண்ட்\nII. கோல் பழங்குடியினர் - ஜார்கண்ட் மற்றும் மேற்கு வங்கம்\nIII. சுவார் பழங்குடியினர் - மேற்கு வங்கம்\nIV. பஹாரியா பழங்குடியினர் - ராஜஸ்தான்", options: ["I & II", "I, II & III", "II, III & IV", "அனைத்தும் சரியானவை"], ans: "B" },
            { id: 11, q: "பட்டியல்-I ஐ பட்டியல்-II உடன் பொருத்துக:\n(A) லட்சுமி பாய் - 4. போரில் கொல்லப்பட்டார்\n(B) தாத்யா டோப் - 3. பிடிக்கப்பட்டு தூக்கிலிடப்பட்டார்\n(C) நானா சாஹேப் - 2. நேபாளத்திற்கு தப்பிச் சென்றார்\n(D) பகதூர் ஷா - 1. ரங்கூனுக்கு நாடு கடத்தப்பட்டார்\n\nசரியான குறியீடு (A) (B) (C) (D):", options: ["4  3  2  1", "2  4  3  1", "1  2  3  4", "4  2  3  1"], ans: "A" },
            { id: 12, q: "பின்வரும் இணைகளில் எது சரியாகப் பொருந்துகிறது?\n1. பிரம்ம சமாஜ் - சுவாமி பிரம்மானந்த்\n2. தேவ சமாஜ் - சுவாமி சத்யானந்த் அக்னிஹோத்ரி\n3. ஆர்ய சமாஜ் - சுவாமி தயானந்த்\n4. ராம கிருஷ்ண மிஷன் - சுவாமி ராமகிருஷ்ண பரமஹம்சர்", options: ["1 மற்றும் 2", "2 மற்றும் 3", "3 மற்றும் 4", "1 மற்றும் 4"], ans: "B" },
            { id: 13, q: "சதி நடைமுறையை ஒழிப்பதற்கு எதிராக பின்வரும் எந்த பத்திரிகை கடுமையான பிரச்சாரத்தை நடத்தியது?", options: ["சம்பத் கௌமதி", "பங்கதூத்", "சமாச்சார் தர்பன்", "சமாச்சார் சந்திரிகா"], ans: "A" },
            { id: 14, q: "வெள்ளையனே வெளியேறு இயக்கத்தின் போது பின்வரும் எந்த இடத்தில் 'ஜாதிய சர்க்கார்' என்ற இணையான அரசாங்கம் அமைக்கப்பட்டது?", options: ["சதாரா", "தமலுக்", "பல்லியா", "மேற்கூறியவற்றில் எதுவுமில்லை"], ans: "B" },
            { id: 15, q: "சுபாஷ் சந்திர போஸ் பதவி விலகிய பிறகு இந்திய தேசிய காங்கிரஸின் தலைவராக யார் தேர்ந்தெடுக்கப்பட்டார்?", options: ["டாக்டர் ராஜேந்திர பிரசாத்", "பட்டாபி சீதாராமையா", "சரோஜினி நாயுடு", "மௌலானா அபுல் கலாம் ஆசாத்"], ans: "A" },
            { id: 16, q: "இந்தியப் பிரிவினைக்கு எதிராக ஜூலை 3, 1947 அன்று 'கருப்பு தினம்' அனுசரித்த கட்சி—", options: ["இந்திய தேசிய காங்கிரஸ்", "ஃபார்வர்டு பிளாக்", "இந்து மகாசபா", "இந்திய கம்யூனிஸ்ட் கட்சி"], ans: "C" },

            { id: 80, q: "எந்த ஐந்தாண்டு திட்டம் வரை, அதிகாரமளிப்பு உத்தி வளர்ச்சியுடன் இணைக்கப்பட்டிருந்தது?", options: ["ஐந்தாவது ஐந்தாண்டு திட்டம்", "ஆறாவது ஐந்தாண்டு திட்டம்", "ஏழாவது ஐந்தாண்டு திட்டம்", "எட்டாவது ஐந்தாண்டு திட்டம்"], ans: "A" },
            { id: 81, q: "இந்தியாவில் அதிக மக்கள் தொகை அடர்த்தி கொண்ட மாநிலம் எது?", options: ["உத்தரப் பிரதேசம்", "பீகார்", "மகாராஷ்டிரா", "மேற்கு வங்கம்"], ans: "B" },

            { id: 86, q: "பெரும்பான்மையான இந்தியர்களின் முதன்மையான தொழில் என்ன?", options: ["தொழில்", "விவசாயம்", "சேவைகள்", "சுரங்கம்"], ans: "B" },
            { id: 87, q: "\"இந்தியாவின் சிலிக்கான் பள்ளத்தாக்கு\" என்று அழைக்கப்படும் இந்திய நகரம் எது?", options: ["ஹைதராபாத்", "புனே", "பெங்களூரு", "சென்னை"], ans: "C" },
            { id: 88, q: "இந்தியாவின் அதிகாரப்பூர்வ நாணயம் என்ன?", options: ["ரூபாய்", "டாலர்", "யூரோ", "யென்"], ans: "A" },
            { id: 89, q: "பரப்பளவில் இந்தியாவில் மிகப்பெரிய மாநிலம் எது?", options: ["மகாராஷ்டிரா", "மத்தியப் பிரதேசம்", "ராஜஸ்தான்", "உத்தரப் பிரதேசம்"], ans: "C" },
            { id: 90, q: "பாலிவுட் என்று அழைக்கப்படும் திரைப்படத் துறைக்கு பிரபலமான நகரம் எது?", options: ["சென்னை", "மும்பை", "கொல்கத்தா", "ஹைதராபாத்"], ans: "B" },
            { id: 91, q: "காலநிலை மாற்றம் குறித்த பாரிஸ் ஒப்பந்தம் என்பது 2015 ஆம் ஆண்டு பிரான்சின் பாரிஸில் நடைபெற்ற ஐக்கிய நாடுகளின் காலநிலை மாற்றம் குறித்த மாநாட்டில் (COP21) ஏற்றுக்கொள்ளப்பட்ட ஒரு சர்வதேச சட்டப்பூர்வ ஒப்பந்தமாகும். இந்த ஒப்பந்தம் ___ ஆம் ஆண்டில் நடைமுறைக்கு வந்தது", options: ["2015", "2016", "2019", "2021"], ans: "B" },
            { id: 92, q: "பின்வரும் இணைகளில் எது சரியானதல்ல?\nI. CER – Certified Emission Reduction\nII. ERU – Emission Reduction Units\nIII. ITMO – Internationally Transferred Mitigation Outcome", options: ["I மற்றும் II சரியானவை", "II மற்றும் III சரியானவை", "I மற்றும் III சரியானவை", "அனைத்தும் சரியானவை"], ans: "D" },
            { id: 93, q: "2024 ஆம் ஆண்டிற்கான நோபல் பரிசு வென்றவர்கள் தொடர்பான பின்வரும் கூற்றுகளைக் கவனியுங்கள்.\nI. நிஹான் ஹிடான்கியோ (அமைதி)\nII. ஹான் காங் (இலக்கியம்)\nIII. டாரன் அசெமோக்லு, சைமன் ஜான்சன், ஜேம்ஸ் ஏ. ராபின்சன் (பொருளாதாரம்)\nIV. ஜான் ஜே. ஹாப்ஃபீல்ட் & ஜெஃப்ரி இ. ஹின்டன் (வேதியியல்)\nமேற்கண்ட கூற்றுகளில் எது சரியானது?", options: ["I, II, III சரியானது", "I, II, IV சரியானது", "II, III, IV சரியானது", "I, III, IV சரியானது"], ans: "A" },
            { id: 94, q: "2021 ஆம் ஆண்டு கிளாஸ்கோ COP26 காலநிலை மாற்ற மாநாடு தொடர்பான கூற்றுகளில் எது சரியானது?\nI. பிரேசில் 2030க்குள் காடழிப்பை நிறுத்துவதாக உறுதியளித்தது.\nII. 100க்கும் மேற்பட்ட நாடுகள் 2030க்குள் காடழிப்பை முடிவுக்குக் கொண்டுவர ஒப்புக்கொண்டன.\nIII. பிரிவு 6 சர்வதேச கார்பன் சந்தை விதிகளை விவரிக்கிறது.\nV. இந்தியா 2070க்குள் நிகர பூஜ்ஜிய இலக்கை நிர்ணயித்தது.", options: ["I, II, III, V ஆகியவை சரியானவை", "II, III, IV, V ஆகியவை சரியானவை", "I, III, IV, V ஆகியவை சரியானவை", "அனைத்தும் சரியானவை"], ans: "A" },
            { id: 95, q: "ஜனவரி 1, 2025 அன்று, மத்திய பாதுகாப்பு அமைச்சகம் 2025 ஆம் ஆண்டை ___ ஆக அறிவித்துள்ளது.", options: ["அமைதி ஆண்டு", "சீர்திருத்த ஆண்டு", "போர் ஆண்டு", "மகிழ்ச்சி ஆண்டு"], ans: "B" },
            { id: 96, q: "பிரதம மந்திரி தன் தானிய கிருஷி யோஜனா பற்றிய பின்வரும் கூற்றுகள் சரியானவையா?\nI. சவால்களை எதிர்கொள்ளும் 100 மாவட்ட விவசாயிகளை ஆதரிக்கும் முயற்சி.\nII. குறைந்த பயிர் விளைச்சல் மற்றும் நிதி உதவி பற்றாக்குறை கொண்ட பகுதிகள்.\nIII. 100 மாவட்டங்களில் 1.7 கோடி விவசாயிகள் பயனடைவார்கள்.", options: ["I, II, III சரியானவை", "II, III, IV சரியானவை", "I, III, IV சரியானவை", "அனைத்தும் சரியானவை"], ans: "A" },
            { id: 97, q: "தேசிய உற்பத்தி இயக்கம் என்பது __ இல் கவனம் செலுத்தும் மத்திய அரசின் இயக்கமாகும்", options: ["உணவு தானியங்களின் உற்பத்தியை அதிகரித்தல்", "தீவிர விவசாய பயிர்ச்செய்கை", "பொம்மைகள் உற்பத்தியில் ஈடுபட்டுள்ள சிறு, நடுத்தர மற்றும் பெரிய தொழில்களுக்கான மேக் இன் இந்தியா திட்டத்தை மேலும் மேம்படுத்துதல்.", "மின்னணுப் பொருட்களின் உற்பத்தியில் அதிகரிப்பு."], ans: "C" },
            { id: 98, q: "2025 ஆஸ்திரேலிய ஓபன் டென்னிஸ் போட்டி ஆண்கள் ஒற்றையர் பட்டத்தை வென்றவர்", options: ["அலெக்சாண்டர் ஸ்வெரெவ்", "நோவக் ஜோகோவிச்", "ஜானிக் சின்னர்", "ரஃபேல் நடால்"], ans: "C" },
            { id: 99, q: "2024 அமைதிக்கான நோபல் பரிசை வென்றவர் யார்?", options: ["ஜெஃப்ரி ஹின்டன்", "மைக்கேல் தலகிராண்ட்", "ஜேம்ஸ் ஏ ராபின்சன்", "நிஹான் ஹிடான்கியோ"], ans: "D" },
            { id: 100, q: "2024 எம்.எஸ்.சுவாமிநாதன் விருதை வென்றவர் யார்?", options: ["டாக்டர்.பொடுபள்ளி மாருதி பிரசன்னா", "ஜான் ஜே. ஹோப்ஃபீல்ட்", "ஆண்ட்ரூ ஜி.பார்டோ", "கேரி ஃபோவ்லர்"], ans: "A" }
        ];

        /* State Management */
        let currentQuestionIndex = 0;
        const userAnswers = new Array(questionsData.length).fill(null); // Stores 'A', 'B', 'C', or 'D'

        // Map option indices to letters
        const optionKeys = ['A', 'B', 'C', 'D'];

        /* Initialization */
        window.addEventListener('DOMContentLoaded', () => {
            initJumpSelect();
            initModalGrid();
            renderQuestion();
        });

        /* Populate Jump Select Dropdown */
        function initJumpSelect() {
            const select = document.getElementById('jumpSelect');
            select.innerHTML = '';
            for (let i = 0; i < questionsData.length; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `Q. ${i + 1}`;
                select.appendChild(opt);
            }
        }

        /* Render Current Question */
        function renderQuestion() {
            const qData = questionsData[currentQuestionIndex];
            const selectedAnswer = userAnswers[currentQuestionIndex];

            // Update Progress & UI Headings
            document.getElementById('currentQNum').textContent = currentQuestionIndex + 1;
            document.getElementById('jumpSelect').value = currentQuestionIndex;
            
            const progressPct = ((currentQuestionIndex + 1) / questionsData.length) * 100;
            document.getElementById('progressBar').style.width = `${progressPct}%`;

            // Question Text
            document.getElementById('questionText').innerText = qData.q;

            // Render Options
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            qData.options.forEach((optText, idx) => {
                const key = optionKeys[idx];
                const isSelected = (selectedAnswer === key);
                const isCorrectOption = (key === qData.ans);

                const optionCard = document.createElement('label');
                
                // Base classes
                let cardClasses = "flex items-start p-4 rounded-xl border cursor-pointer transition-all duration-200 shadow-sm relative overflow-hidden ";
                
                if (selectedAnswer !== null) {
                    // Option style after answering
                    if (key === qData.ans) {
                        cardClasses += "bg-emerald-50 border-emerald-500 text-emerald-900 font-medium ring-2 ring-emerald-500/20";
                    } else if (isSelected && !isCorrectOption) {
                        cardClasses += "bg-rose-50 border-rose-400 text-rose-900 font-medium";
                    } else {
                        cardClasses += "bg-white border-slate-200 opacity-60 text-slate-700";
                    }
                } else {
                    // Default state before answering
                    cardClasses += "bg-white border-slate-200 hover:border-brand-400 hover:bg-brand-50/40 text-slate-700";
                }

                optionCard.className = cardClasses;

                // Build Checkbox & Label HTML
                optionCard.innerHTML = `
                    <div class="flex items-center h-6 mr-3">
                        <input type="checkbox" name="q_option" value="${key}" 
                            ${isSelected ? 'checked' : ''} 
                            onchange="selectOption('${key}')"
                            class="w-5 h-5 text-brand-600 rounded border-slate-300 focus:ring-brand-500 cursor-pointer accent-brand-600">
                    </div>
                    <div class="flex-grow">
                        <span class="inline-block font-bold mr-2 ${isSelected ? 'text-brand-700' : 'text-slate-500'}">(${key})</span>
                        <span class="text-sm sm:text-base leading-snug">${optText}</span>
                    </div>
                    ${selectedAnswer !== null && key === qData.ans ? `
                        <div class="ml-2 text-emerald-600">
                            <i class="fa-solid fa-circle-check text-lg"></i>
                        </div>
                    ` : ''}
                    ${selectedAnswer !== null && isSelected && !isCorrectOption ? `
                        <div class="ml-2 text-rose-500">
                            <i class="fa-solid fa-circle-xmark text-lg"></i>
                        </div>
                    ` : ''}
                `;

                container.appendChild(optionCard);
            });

            // Handle Correct Answer Display Box Below
            const answerBox = document.getElementById('answerBox');
            const answerIcon = document.getElementById('answerIcon');
            const answerTitle = document.getElementById('answerTitle');
            const answerDetail = document.getElementById('answerDetail');
            const statusBadge = document.getElementById('statusBadge');

            if (selectedAnswer !== null) {
                answerBox.classList.remove('hidden');
                
                const isCorrect = (selectedAnswer === qData.ans);
                
                if (isCorrect) {
                    answerBox.className = "mx-6 sm:mx-8 mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-300 text-emerald-900 transition-all duration-300 animate-select";
                    answerIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-xl"></i>`;
                    answerTitle.textContent = "சரியான பதில்! (Correct Answer)";
                    answerTitle.className = "font-bold text-emerald-800 text-sm sm:text-base";
                    statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-800 border border-emerald-300";
                    statusBadge.textContent = "Correct";
                } else {
                    answerBox.className = "mx-6 sm:mx-8 mb-6 p-4 rounded-xl border bg-rose-50 border-rose-300 text-rose-900 transition-all duration-300 animate-select";
                    answerIcon.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-rose-600 text-xl"></i>`;
                    answerTitle.textContent = "தவறான பதில்! (Incorrect Answer)";
                    answerTitle.className = "font-bold text-rose-800 text-sm sm:text-base";
                    statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-md bg-rose-100 text-rose-800 border border-rose-300";
                    statusBadge.textContent = "Incorrect";
                }

                // Displace / Display the correct answer
                const correctOptIndex = optionKeys.indexOf(qData.ans);
                const correctOptText = qData.options[correctOptIndex];
                answerDetail.innerHTML = `பதில் : <strong>(${qData.ans}) ${correctOptText}</strong>`;
            } else {
                answerBox.classList.add('hidden');
                statusBadge.className = "text-xs font-semibold px-2.5 py-1 rounded-md bg-slate-200 text-slate-600";
                statusBadge.textContent = "Unanswered";
            }

            // Update Navigation Buttons State
            document.getElementById('prevBtn').disabled = (currentQuestionIndex === 0);
            
            const nextBtnText = document.getElementById('nextBtnText');
            if (currentQuestionIndex === questionsData.length - 1) {
                nextBtnText.textContent = "Finish / Palette";
            } else {
                nextBtnText.textContent = "Next";
            }

            updateScoreTracker();
            updateModalGridHighlight();
        }

        /* User Option Click Handler */
        function selectOption(key) {
            userAnswers[currentQuestionIndex] = key;
            renderQuestion();
        }

        /* Navigation Controls */
        function nextQuestion() {
            if (currentQuestionIndex < questionsData.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                toggleGridModal();
            }
        }

        function prevQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function jumpToQuestion(index) {
            if (index >= 0 && index < questionsData.length) {
                currentQuestionIndex = index;
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        /* Score Tracker Counter */
        function updateScoreTracker() {
            const attemptedCount = userAnswers.filter(a => a !== null).length;
            let correctCount = 0;
            
            userAnswers.forEach((ans, idx) => {
                if (ans === questionsData[idx].ans) {
                    correctCount++;
                }
            });

            document.getElementById('scoreTracker').textContent = `Score: ${correctCount} / ${attemptedCount} (Total 100)`;
        }

        /* Question Palette / Grid Modal Logic */
        function toggleGridModal() {
            const modal = document.getElementById('gridModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                updateModalGridHighlight();
            }
        }

        function initModalGrid() {
            const container = document.getElementById('modalGridContainer');
            container.innerHTML = '';
            
            for (let i = 0; i < questionsData.length; i++) {
                const btn = document.createElement('button');
                btn.id = `gridBtn-${i}`;
                btn.textContent = i + 1;
                btn.onclick = () => {
                    jumpToQuestion(i);
                    toggleGridModal();
                };
                container.appendChild(btn);
            }
        }

        function updateModalGridHighlight() {
            for (let i = 0; i < questionsData.length; i++) {
                const btn = document.getElementById(`gridBtn-${i}`);
                if (!btn) continue;

                const ans = userAnswers[i];
                const isCurrent = (i === currentQuestionIndex);

                let baseClass = "h-9 w-full rounded-lg font-bold text-xs flex items-center justify-center transition-all border ";

                if (isCurrent) {
                    baseClass += "ring-2 ring-brand-600 ring-offset-1 ";
                }

                if (ans === null) {
                    baseClass += "bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300";
                } else if (ans === questionsData[i].ans) {
                    baseClass += "bg-emerald-500 hover:bg-emerald-600 text-white border-emerald-600";
                } else {
                    baseClass += "bg-rose-500 hover:bg-rose-600 text-white border-rose-600";
                }

                btn.className = baseClass;
            }
        }

        /* Reset Entire Quiz */
        function resetQuiz() {
            if (confirm("Are you sure you want to reset all selected answers and start over?")) {
                for (let i = 0; i < userAnswers.length; i++) {
                    userAnswers[i] = null;
                }
                currentQuestionIndex = 0;
                renderQuestion();
            }
        }

        /* Disable keyboard shortcuts for copying/inspecting */
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'u' || e.key === 's' || e.key === 'a')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
